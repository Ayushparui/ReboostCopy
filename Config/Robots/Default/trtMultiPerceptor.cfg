// TRTMultiPerceptor parameters.
// Loaded automatically by LOADS_PARAMETERS at module construction.
// Override per-robot in Config/Robots/<name>/ or per-scenario in Config/Scenarios/<name>/.
//
// BUILD_BOOSTER:  enginePath is used (TensorRT engine on Jetson Orin)
// otherwise:      onnxModelPath is used (ONNX Runtime on desktop / SimRobot)
//
// Class IDs must match the training label order of the deployed model.
// humanClassId = -1 means the class is not present in the current model.
// Set it to the correct index when a fallen-player class is added.

enginePath = "NeuralNets/TRTVision/MultiClassV3.engine";
onnxModelPath = "NeuralNets/TRTVision/MultiClassV3.onnx";
inputWidth = 544;
inputHeight = 448;
ballConfidenceThreshold = 0.5;
robotConfidenceThreshold = 0.5;
ballClassId = 0;
robotClassId = 1;
humanClassId = -1;
